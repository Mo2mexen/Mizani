# Mizani: one command runs everything, on Windows, Linux and Apple Silicon.
#   docker compose up
# NVIDIA GPU (Windows/Linux):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# The app (U1) is added here when it is built.

services:
  ollama:
    image: ollama/ollama:0.40.8
    environment:
      # The OpenAI-compatible /v1 API cannot set the context size per request, so set it here.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Local only: no cloud models or web search, so no patient data can leave the machine.
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Pulls the model once (3.3 GB for the default), then exits. Later starts are instant.
  ollama-pull:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3.5:4b-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Our MCP server: SATS tools, approval-gated commit, hash-chained audit log.
  # Reachable from other services at http://mizani-mcp:8000/mcp, and from this machine only
  # at http://127.0.0.1:8000/mcp (for MCP Inspector).
  mizani-mcp:
    build: .
    environment:
      MIZANI_APPROVAL_SECRET: ${MIZANI_APPROVAL_SECRET:-local-demo-secret-change-me}
    volumes:
      - mizani-data:/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  ollama-models:
  mizani-data:
