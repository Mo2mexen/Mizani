# Mizani: one command runs everything, on Windows, Linux and Apple Silicon.
#   docker compose up
# NVIDIA GPU (Windows/Linux):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# API + agent: http://127.0.0.1:8080/api (the web UI joins when it is built).

services:
  ollama:
    image: ollama/ollama:0.40.8
    environment:
      # The OpenAI-compatible /v1 API cannot set the context size per request, so set it here.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Local only: no cloud models or web search, so no patient data can leave the machine.
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Pulls the model once (3.3 GB for the default), then exits. Later starts are instant.
  ollama-pull:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3.5:4b-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Our MCP server: SATS tools, approval-gated commit, hash-chained audit log.
  # Reachable from other services at http://mizani-mcp:8000/mcp, and from this machine only
  # at http://127.0.0.1:8000/mcp (for MCP Inspector).
  mizani-mcp:
    build: .
    environment:
      MIZANI_APPROVAL_SECRET: ${MIZANI_APPROVAL_SECRET:-local-demo-secret-change-me}
    volumes:
      - mizani-data:/data
    ports:
      - "127.0.0.1:8000:8000"

  # The API and the agent. Shares mizani-data with the MCP server to read the audit log;
  # agent checkpoints go to /data/checkpoints.db. Reachable from this machine only.
  app:
    build: .
    command: ["mizani-api"]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b-q4_K_M}
      MIZANI_MCP_URL: http://mizani-mcp:8000/mcp
      MIZANI_APPROVAL_SECRET: ${MIZANI_APPROVAL_SECRET:-local-demo-secret-change-me}
      MIZANI_API_HOST: 0.0.0.0
    volumes:
      - mizani-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mizani-mcp:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama-models:
  mizani-data:
