# Mizani: one command runs everything, on Windows, Linux and Apple Silicon.
#   docker compose up
# NVIDIA GPU (Windows/Linux):
#   docker compose -f docker-compose.yml -f docker/docker-compose.gpu.yml up
# Then open http://127.0.0.1:8090 for the nurse's page (API and docs: /api, /docs).
# Every port listens on this machine only (127.0.0.1). If one is taken, set API_HOST_PORT,
# MCP_HOST_PORT, FHIR_MCP_HOST_PORT or HAPI_HOST_PORT in .env (see .env.example).

services:
  ollama:
    image: ollama/ollama:0.40.8
    environment:
      # The OpenAI-compatible /v1 API cannot set the context size per request, so set it here.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Local only: no cloud models or web search, so no patient data can leave the machine.
      OLLAMA_NO_CLOUD: "1"
      # Keep the model in memory. Ollama's default unloads it after 5 idle minutes, and the next
      # patient then waits for it to load again.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Pulls the model once (3.3 GB for the default), then exits. Later starts are instant.
  # When LLM_BASE_URL points at another model server (Ollama installed on this machine, a GPU
  # machine on the network), that server already has the model, so nothing is pulled here.
  ollama-pull:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: ollama:11434
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b-q4_K_M}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$LLM_BASE_URL" in
          *//ollama:11434*) exec ollama pull "$$LLM_MODEL" ;;
          *) echo "LLM_BASE_URL is $$LLM_BASE_URL: the model is served there, nothing to pull" ;;
        esac
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Loads the model into memory once it is pulled, then exits. Nothing waits for it: the page
  # starts meanwhile, and the first patient does not pay for reading the model from disk
  # (minutes on a hard disk). Skipped when another server has the model.
  ollama-warm:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: ollama:11434
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b-q4_K_M}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$LLM_BASE_URL" in
          *//ollama:11434*)
            if ollama run "$$LLM_MODEL" "" >/dev/null 2>&1; then echo "$$LLM_MODEL is loaded"
            else echo "$$LLM_MODEL was not loaded now; the first patient will load it"; fi ;;
          *) echo "LLM_BASE_URL is $$LLM_BASE_URL: the model is served there, nothing to load" ;;
        esac
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"

  # Our MCP server: SATS tools, approval-gated commit, hash-chained audit log.
  # Reachable from other services at http://mizani-mcp:8000/mcp, and from this machine only
  # at http://127.0.0.1:8000/mcp (for MCP Inspector).
  mizani-mcp:
    build:  # built from the repo root; the Dockerfile and its ignore file live in docker/
      context: .
      dockerfile: docker/Dockerfile
    environment:
      MIZANI_APPROVAL_SECRET: ${MIZANI_APPROVAL_SECRET:-local-demo-secret-change-me}
      # The names it answers to (DNS-rebinding guard): this machine, and the app by service name.
      MIZANI_ALLOWED_HOSTS: 127.0.0.1,localhost,mizani-mcp
      # The triage chart: a rule pack file in src/mizani/rules/ (default: the adult SATS chart).
      MIZANI_RULE_PACK: ${MIZANI_RULE_PACK:-sats_adult}
    volumes:
      - mizani-data:/data
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8000}:8000"
    # Healthy once it answers and can read the triage database; `docker compose ps` shows it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 3

  # Local FHIR store (HAPI FHIR, R4, its built-in H2 database). Browse it at
  # http://127.0.0.1:18080/fhir from this machine only (18080: 8080 is often taken).
  hapi-fhir:
    image: hapiproject/hapi:v8.12.0-2
    environment:
      hapi.fhir.fhir_version: R4
      # Its database in a volume, so `docker compose down` keeps the FHIR records. /home/nonroot
      # belongs to the image's user (65532), and a new volume mounted there inherits that owner.
      spring.datasource.url: jdbc:h2:file:/home/nonroot/h2
    volumes:
      - hapi-data:/home/nonroot
    ports:
      - "127.0.0.1:${HAPI_HOST_PORT:-18080}:8080"

  # Borrowed MCP server: wso2 fhir-mcp-server, built from the pinned 0.10.0 release commit.
  # Auth is off because HAPI is local and unreachable from outside this machine.
  # Agent URL: http://fhir-mcp:8000/mcp (from this machine: http://127.0.0.1:8001/mcp).
  fhir-mcp:
    build: https://github.com/wso2/fhir-mcp-server.git#78d750ba3f91de3b5df10c0963d725dd8c78da0a
    environment:
      FHIR_SERVER_BASE_URL: http://hapi-fhir:8080/fhir
      FHIR_SERVER_DISABLE_AUTHORIZATION: "True"
      FHIR_MCP_HOST: 0.0.0.0
      FHIR_MCP_PORT: "8000"
      FHIR_MCP_REQUEST_TIMEOUT: "120"  # seconds; wso2's default 30 can be too short on a slow disk
    depends_on:
      - hapi-fhir
    ports:
      - "127.0.0.1:${FHIR_MCP_HOST_PORT:-8001}:8000"
    # HAPI's image has no shell, so its readiness is checked from here: healthy once a FHIR
    # search answers, which also warms HAPI's database up before the first triage is written.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://hapi-fhir:8080/fhir/Patient?_count=1', timeout=60)"]
      interval: 5s
      timeout: 65s
      retries: 60

  # The nurse's page, the API and the agent. Shares mizani-data with the MCP server to read
  # the audit log; agent checkpoints go to /data/checkpoints.db. Reachable from this machine only.
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["mizani-api"]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b-q4_K_M}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-none}
      LLM_API_KEY: ${LLM_API_KEY:-}  # only for a model server that checks keys; Ollama needs none
      MIZANI_SECOND_LOOK: ${MIZANI_SECOND_LOOK:-}  # 1 turns on the agent's second look
      MIZANI_MCP_URL: http://mizani-mcp:8000/mcp
      MIZANI_FHIR_MCP_URL: http://fhir-mcp:8000/mcp/
      MIZANI_APPROVAL_SECRET: ${MIZANI_APPROVAL_SECRET:-local-demo-secret-change-me}
      MIZANI_API_HOST: 0.0.0.0
      # The names the page may be opened with (DNS-rebinding guard); a ward server adds its own.
      MIZANI_ALLOWED_HOSTS: ${MIZANI_ALLOWED_HOSTS:-127.0.0.1,localhost}
    volumes:
      - mizani-data:/data
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8090}:8090"  # 8090, not 8080: 8080 is often taken
    # Healthy once the API answers and can read its database (`/api/health`).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 3
    depends_on:
      mizani-mcp:
        condition: service_healthy
      fhir-mcp:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  # Backups, run by hand and never by `docker compose up` (profile "tools"):
  #   docker compose run --rm backup                 a new backup in ./backups/<UTC time>/
  #   docker compose run --rm backup list            the backups there are
  #   docker compose run --rm backup restore <name>  after `docker compose down` only
  # Root, because HAPI's volume is private to its own user; restored files go back to each
  # volume's owner. Details: docs/systems/backup.md.
  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["tools"]
    user: "0:0"
    entrypoint: ["mizani-backup"]
    command: ["create"]
    environment:
      MIZANI_DATA_DIR: /data
      MIZANI_HAPI_DIR: /hapi
      MIZANI_BACKUP_DIR: /backups
    volumes:
      - mizani-data:/data
      - hapi-data:/hapi
      - ./backups:/backups

volumes:
  ollama-models:
  mizani-data:
  hapi-data:
