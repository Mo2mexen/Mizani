# Mizani: one command runs everything, on Windows, Linux and Apple Silicon.
#   docker compose up
# NVIDIA GPU (Windows/Linux):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# The agent and API (app) are added here when they are built.

services:
  ollama:
    image: ollama/ollama:0.40.8
    environment:
      # The OpenAI-compatible /v1 API cannot set the context size per request, so set it here.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Local only: no cloud models or web search, so no patient data can leave the machine.
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Pulls the model once (3.3 GB for the default), then exits. Later starts are instant.
  ollama-pull:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3.5:4b-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Our MCP server: SATS tools, approval-gated commit, hash-chained audit log.
  # Reachable from other services at http://mizani-mcp:8000/mcp, and from this machine only
  # at http://127.0.0.1:8000/mcp (for MCP Inspector).
  mizani-mcp:
    build: .
    environment:
      MIZANI_APPROVAL_SECRET: ${MIZANI_APPROVAL_SECRET:-local-demo-secret-change-me}
    volumes:
      - mizani-data:/data
    ports:
      - "127.0.0.1:8000:8000"

  # Local FHIR store (HAPI FHIR, R4, its built-in database). Browse it at
  # http://127.0.0.1:18080/fhir from this machine only (18080: 8080 is often taken).
  hapi-fhir:
    image: hapiproject/hapi:v8.12.0-2
    environment:
      hapi.fhir.fhir_version: R4
    ports:
      - "127.0.0.1:18080:8080"

  # Borrowed MCP server: wso2 fhir-mcp-server, built from the pinned 0.10.0 release commit.
  # Auth is off because HAPI is local and unreachable from outside this machine.
  # Agent URL: http://fhir-mcp:8000/mcp (from this machine: http://127.0.0.1:8001/mcp).
  fhir-mcp:
    build: https://github.com/wso2/fhir-mcp-server.git#78d750ba3f91de3b5df10c0963d725dd8c78da0a
    environment:
      FHIR_SERVER_BASE_URL: http://hapi-fhir:8080/fhir
      FHIR_SERVER_DISABLE_AUTHORIZATION: "True"
      FHIR_MCP_HOST: 0.0.0.0
      FHIR_MCP_PORT: "8000"
    depends_on:
      - hapi-fhir
    ports:
      - "127.0.0.1:8001:8000"

volumes:
  ollama-models:
  mizani-data:
