# Mizani: one command runs everything, on Windows, Linux and Apple Silicon.
#   docker compose up
# NVIDIA GPU (Windows/Linux):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Then open http://127.0.0.1:8090 for the nurse's page (API and docs: /api, /docs).
# Every port listens on this machine only (127.0.0.1). If one is taken, set API_HOST_PORT,
# MCP_HOST_PORT, FHIR_MCP_HOST_PORT or HAPI_HOST_PORT in .env (see .env.example).

services:
  ollama:
    image: ollama/ollama:0.40.8
    environment:
      # The OpenAI-compatible /v1 API cannot set the context size per request, so set it here.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Local only: no cloud models or web search, so no patient data can leave the machine.
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Pulls the model once (3.3 GB for the default), then exits. Later starts are instant.
  ollama-pull:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3.5:4b-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Our MCP server: SATS tools, approval-gated commit, hash-chained audit log.
  # Reachable from other services at http://mizani-mcp:8000/mcp, and from this machine only
  # at http://127.0.0.1:8000/mcp (for MCP Inspector).
  mizani-mcp:
    build: .
    environment:
      MIZANI_APPROVAL_SECRET: ${MIZANI_APPROVAL_SECRET:-local-demo-secret-change-me}
    volumes:
      - mizani-data:/data
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8000}:8000"

  # Local FHIR store (HAPI FHIR, R4, its built-in H2 database). Browse it at
  # http://127.0.0.1:18080/fhir from this machine only (18080: 8080 is often taken).
  hapi-fhir:
    image: hapiproject/hapi:v8.12.0-2
    environment:
      hapi.fhir.fhir_version: R4
      # Its database in a volume, so `docker compose down` keeps the FHIR records. /home/nonroot
      # belongs to the image's user (65532), and a new volume mounted there inherits that owner.
      spring.datasource.url: jdbc:h2:file:/home/nonroot/h2
    volumes:
      - hapi-data:/home/nonroot
    ports:
      - "127.0.0.1:${HAPI_HOST_PORT:-18080}:8080"

  # Borrowed MCP server: wso2 fhir-mcp-server, built from the pinned 0.10.0 release commit.
  # Auth is off because HAPI is local and unreachable from outside this machine.
  # Agent URL: http://fhir-mcp:8000/mcp (from this machine: http://127.0.0.1:8001/mcp).
  fhir-mcp:
    build: https://github.com/wso2/fhir-mcp-server.git#78d750ba3f91de3b5df10c0963d725dd8c78da0a
    environment:
      FHIR_SERVER_BASE_URL: http://hapi-fhir:8080/fhir
      FHIR_SERVER_DISABLE_AUTHORIZATION: "True"
      FHIR_MCP_HOST: 0.0.0.0
      FHIR_MCP_PORT: "8000"
      FHIR_MCP_REQUEST_TIMEOUT: "120"  # seconds; wso2's default 30 can be too short on a slow disk
    depends_on:
      - hapi-fhir
    ports:
      - "127.0.0.1:${FHIR_MCP_HOST_PORT:-8001}:8000"
    # HAPI's image has no shell, so its readiness is checked from here: healthy once a FHIR
    # search answers, which also warms HAPI's database up before the first triage is written.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://hapi-fhir:8080/fhir/Patient?_count=1', timeout=60)"]
      interval: 5s
      timeout: 65s
      retries: 60

  # The nurse's page, the API and the agent. Shares mizani-data with the MCP server to read
  # the audit log; agent checkpoints go to /data/checkpoints.db. Reachable from this machine only.
  app:
    build: .
    command: ["mizani-api"]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b-q4_K_M}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-none}
      MIZANI_MCP_URL: http://mizani-mcp:8000/mcp
      MIZANI_FHIR_MCP_URL: http://fhir-mcp:8000/mcp/
      MIZANI_APPROVAL_SECRET: ${MIZANI_APPROVAL_SECRET:-local-demo-secret-change-me}
      MIZANI_API_HOST: 0.0.0.0
    volumes:
      - mizani-data:/data
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8090}:8090"  # 8090, not 8080: 8080 is often taken
    depends_on:
      mizani-mcp:
        condition: service_started
      fhir-mcp:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama-models:
  mizani-data:
  hapi-data:
