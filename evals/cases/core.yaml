  vitals: {respiratory_rate: 18, heart_rate: 96, systolic_bp: 150, temperature: 36.9, avpu: alert, mobility: walking, trauma: false}
  later_vitals: {respiratory_rate: 30, heart_rate: 135, systolic_bp: 75}
