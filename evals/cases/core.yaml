  source: "Orange target time is 10 min [S2 p6 Table 3]: no re-check flag at 9 min, a flag at 11 min; re-triage TEWS RR 30 = 3, HR 135 = 3, SBP 75 = 2 -> 8 red [S1, S3], committed only by a nurse and then replacing the old entry"

- id: remeasure-01
  kind: remeasure
