  complaint: Dizzy since this morning.
  vitals: {respiratory_rate: 14, systolic_bp: 120, temperature: 37.0, avpu: alert, mobility: walking, trauma: false}
  later_vitals: {heart_rate: 135}
  expected: {colour: green, tews: 0, remeasure: [heart_rate], flags: [incomplete], later_colour: yellow, later_tews: 3}
  source: "Missing pulse -> re-measure, incomplete; TEWS 0 green [S1, S3]. After the nurse measures HR 135 = 3 -> 3 yellow, re-scored without another model call"
